<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - AcquireMock</title>
    <link rel="icon" type="image/png" href="/static/brand/favicon-light-32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/static/brand/favicon-dark-32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/static/brand/favicon-light-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/payment.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.dataset.theme = 'dark';
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="pay-shell">
        <header class="pay-topbar">
            <a href="/" class="brand-link" aria-label="AcquireMock">
                <img src="/static/brand/logo-horizontal-light.png" alt="AcquireMock" height="22" class="brand-logo-light">
                <img src="/static/brand/logo-horizontal-dark.png" alt="AcquireMock" height="22" class="brand-logo-dark">
            </a>

            <div class="topbar-controls">
                <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <svg class="sun-icon" style="display: none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <main class="pay-card">
            <span class="ref-badge" style="color: var(--brand-coral-ink);">404</span>
            <h1 class="card-title" style="margin-top: 8px;">Page not found</h1>
            <p class="card-subtitle" style="margin-bottom: 24px;">
                The page or payment link you requested does not exist or has been moved.
            </p>
            <div class="form-stack">
                <a href="/" class="btn-primary">Back to homepage</a>
                <a href="/app/overview" class="btn-secondary">Open developer workspace</a>
            </div>
        </main>
    </div>

    <script src="/static/js/i18n.js"></script>
</body>
</html>
