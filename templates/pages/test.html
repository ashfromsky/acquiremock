<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Playground - AcquireMock</title>
    <meta name="acquiremock-base-url" content="{{ base_url or 'http://localhost:8000' }}">
    <link rel="icon" type="image/png" href="/static/brand/favicon-light-32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/static/brand/favicon-dark-32.png" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/payment.css">
</head>
<body>
    <div class="pay-shell">
        <header class="pay-topbar">
            <a href="/" class="brand-link" aria-label="AcquireMock">
                <img src="/static/brand/logo-horizontal-light.png" alt="AcquireMock" height="22" class="brand-logo-light">
                <img src="/static/brand/logo-horizontal-dark.png" alt="AcquireMock" height="22" class="brand-logo-dark">
            </a>
        </header>
        <main class="pay-card">
            <h1 class="card-title">Invoice test fallback</h1>
            <p class="card-subtitle" style="margin-bottom: 20px;">
                Create a test invoice against {{ base_url or 'http://localhost:8000' }}.
            </p>
            <form id="testForm" class="form-stack">
                <div class="field-group">
                    <label class="field-label" for="amount">Amount</label>
                    <input type="number" id="amount" class="field-input mono" value="25000" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="reference">Reference</label>
                    <input type="text" id="reference" class="field-input" value="TEST-ORDER-001" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="webhookUrl">Webhook URL</label>
                    <input type="url" id="webhookUrl" class="field-input" value="https://webhook.site/unique-id" required>
                </div>
                <div class="field-group">
                    <label class="field-label" for="redirectUrl">Redirect URL</label>
                    <input type="url" id="redirectUrl" class="field-input" value="{{ base_url or 'http://localhost:8000' }}" required>
                </div>
                <div id="fallbackError" class="inline-alert" role="alert"></div>
                <button type="submit" class="btn-primary">Create invoice</button>
            </form>
            <div id="resultBox" style="display: none; margin-top: 20px;">
                <a href="#" id="checkoutLink" target="_blank" class="btn-secondary">Open hosted checkout</a>
            </div>
        </main>
    </div>
    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('fallbackError');
            errBox.classList.remove('visible');
            try {
                const res = await fetch('/api/create-invoice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        amount: parseInt(document.getElementById('amount').value, 10),
                        reference: document.getElementById('reference').value,
                        webhookUrl: document.getElementById('webhookUrl').value,
                        redirectUrl: document.getElementById('redirectUrl').value
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || 'API Error');
                document.getElementById('checkoutLink').href = data.pageUrl;
                document.getElementById('resultBox').style.display = 'block';
            } catch (err) {
                errBox.textContent = err.message || 'Error creating invoice';
                errBox.classList.add('visible');
            }
        });
    </script>
</body>
</html>
