<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - AcquireMock</title>
    <link rel="icon" type="image/png" href="/static/brand/favicon-light-32.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="/static/brand/favicon-dark-32.png" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/png" href="/static/brand/favicon-light-32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/payment.css">
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (saved === 'dark' || (!saved && prefersDark)) {
                    document.documentElement.dataset.theme = 'dark';
                }
            } catch (e) {}
        })();
    </script>
</head>
<body>
    <div class="modal-overlay" id="emailModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-card">
            <div id="step1" class="step-container active">
                <h2 id="modalTitle" class="card-title" data-i18n="enter_email">Sign in</h2>
                <p class="card-subtitle" style="margin-bottom: 20px;" data-i18n="enter_email_desc">Enter your email to continue to checkout</p>
                <div class="form-stack">
                    <div class="field-group">
                        <label class="field-label" for="modalEmailInput">Email</label>
                        <input type="email" id="modalEmailInput" class="field-input" placeholder="name@example.com" autocomplete="email">
                    </div>
                    <div id="step1Error" class="inline-alert" role="alert"></div>
                    <button type="button" class="btn-primary" id="sendCodeBtn" onclick="sendAuthCode()" data-i18n="get_code">Send code</button>
                </div>
            </div>

            <div id="step2" class="step-container">
                <h2 class="card-title" data-i18n="verify_title">Email verification</h2>
                <p class="card-subtitle" style="margin-bottom: 20px;">
                    <span data-i18n="verify_desc">We sent a 4-digit code to</span>
                    <strong id="displayEmail" style="color: var(--text-primary);"></strong>
                </p>
                <div class="form-stack">
                    <div class="field-group">
                        <label class="field-label" for="modalCodeInput">Verification code</label>
                        <input type="text" id="modalCodeInput" class="field-input otp-input" placeholder="0000" maxlength="4" inputmode="numeric" autocomplete="one-time-code">
                    </div>
                    <div id="step2Error" class="inline-alert" role="alert"></div>
                    <button type="button" class="btn-primary" id="verifyCodeBtn" onclick="verifyAuthCode()" data-i18n="verify_btn">Continue</button>
                    <button type="button" class="btn-link" onclick="showStep(1)" data-i18n="change_email">Change email</button>
                </div>
            </div>
        </div>
    </div>

    <div class="pay-shell">
        <header class="pay-topbar">
            <a href="/" class="brand-link" aria-label="AcquireMock">
                <img src="/static/brand/logo-horizontal-light.png" alt="AcquireMock" height="22" class="brand-logo-light">
                <img src="/static/brand/logo-horizontal-dark.png" alt="AcquireMock" height="22" class="brand-logo-dark">
            </a>

            <div class="topbar-controls">
                <div class="lang-switcher" role="group" aria-label="Language">
                    <button type="button" class="lang-btn" onclick="changeLanguage('uk')">UK</button>
                    <button type="button" class="lang-btn" onclick="changeLanguage('en')">EN</button>
                    <button type="button" class="lang-btn" onclick="changeLanguage('de')">DE</button>
                    <button type="button" class="lang-btn" onclick="changeLanguage('ru')">RU</button>
                </div>
                <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
                    <svg class="sun-icon" style="display: none;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <main class="pay-card" id="mainContainer">
            <div class="amount-block">
                <span class="amount-eyebrow" data-i18n="to_pay">Amount due</span>
                <div class="amount-value">{{ amount }} {{ currency_symbol }}</div>
                <div class="amount-meta">
                    <span class="ref-badge">#{{ reference }}</span>
                    <button type="button" id="currentUserDisplay" class="account-switch" onclick="resetUser()" data-i18n="change_acc">
                        Switch account
                    </button>
                </div>
            </div>

            <form id="paymentForm" method="POST" action="/api/pay/{{ payment_id }}" class="form-stack">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <input type="hidden" name="email" id="hiddenEmail">
                <input type="hidden" name="saved_card_id" id="savedCardId">

                <div id="savedCardsSection" style="display: none;">
                    <div class="saved-cards-header">
                        <span class="field-label" data-i18n="your_cards">Saved cards</span>
                        <button type="button" id="clearSavedCardBtn" class="btn-link" style="display: none; padding: 0;" onclick="clearSavedCardSelection()" data-i18n="use_other_card">
                            Use another card
                        </button>
                    </div>
                    <div class="saved-cards-list" id="savedCardsList"></div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="cardNumber" data-i18n="card_label">Card number</label>
                    <input type="text" id="cardNumber" name="card_number" class="field-input mono" placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric" required>
                </div>

                <div class="form-row-2">
                    <div class="field-group">
                        <label class="field-label" for="expiry" data-i18n="expiry_label">Expiry</label>
                        <input type="text" id="expiry" name="expiry" class="field-input mono" placeholder="MM/YY" maxlength="5" inputmode="numeric" required>
                    </div>
                    <div class="field-group">
                        <label class="field-label" for="cvv" data-i18n="cvv_label">CVV</label>
                        <input type="text" id="cvv" name="cvv" class="field-input mono" placeholder="123" maxlength="3" inputmode="numeric" required>
                    </div>
                </div>

                <label class="checkbox-row">
                    <input type="checkbox" id="saveCard" name="save_card" value="true">
                    <span data-i18n="save_card">Save card for future payments</span>
                </label>

                <button type="submit" class="btn-primary" id="payBtn" data-i18n="pay_btn" data-amount="{{ amount }}" data-currency="{{ currency_symbol }}">
                    Pay {{ amount }} {{ currency_symbol }}
                </button>
            </form>

            <div class="helper-box">
                <span class="mono" data-i18n="sandbox_note">Sandbox card: 4444 4444 4444 4444</span>
                <button type="button" class="btn-link" style="padding: 0;" onclick="fillSandboxCard()" data-i18n="fill_test_card">
                    Fill test card
                </button>
            </div>
        </main>

        <section class="pay-card" id="historyContainer" style="display: none;" aria-label="Recent transactions">
            <h2 class="card-title" style="font-size: 16px; margin-bottom: 12px;" data-i18n="history_title">Recent transactions</h2>
            <div id="historyList"></div>
        </section>

        <footer class="pay-footer" data-i18n="mock_disclaimer">
            AcquireMock sandbox checkout. Never enter real payment card details.
        </footer>
    </div>

    <script src="/static/js/i18n.js"></script>
    <script>
        const prefillEmail = "{{ prefill_email if prefill_email else '' }}";
        const currencySymbol = "{{ currency_symbol }}";
        let currentAuthEmail = "";

        document.addEventListener('DOMContentLoaded', () => {
            if (prefillEmail) {
                initializeUser(prefillEmail);
            } else {
                document.getElementById('emailModal').style.display = 'flex';
                document.getElementById('modalEmailInput').focus();
            }
        });

        function showInlineError(id, msg) {
            const el = document.getElementById(id);
            if (!el) return;
            if (!msg) {
                el.textContent = '';
                el.classList.remove('visible');
                return;
            }
            el.textContent = msg;
            el.classList.add('visible');
        }

        function showStep(step) {
            showInlineError('step1Error', '');
            showInlineError('step2Error', '');
            document.querySelectorAll('.step-container').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            if (step === 1) {
                document.getElementById('modalEmailInput').focus();
            } else {
                document.getElementById('modalCodeInput').focus();
            }
        }

        async function sendAuthCode() {
            const email = document.getElementById('modalEmailInput').value.trim();
            if (!email || !email.includes('@')) {
                showInlineError('step1Error', 'Enter a valid email address.');
                return;
            }
            showInlineError('step1Error', '');
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/send-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: email})
                });
                if (res.ok) {
                    currentAuthEmail = email;
                    document.getElementById('displayEmail').textContent = email;
                    showStep(2);
                } else {
                    const errData = await res.json().catch(() => ({}));
                    showInlineError('step1Error', errData.detail || 'Could not send verification code.');
                }
            } catch (e) {
                showInlineError('step1Error', 'Network error while sending code.');
            } finally {
                btn.disabled = false;
            }
        }

        async function verifyAuthCode() {
            const code = document.getElementById('modalCodeInput').value.trim();
            if (code.length < 4) {
                showInlineError('step2Error', 'Enter the 4-digit verification code.');
                return;
            }
            showInlineError('step2Error', '');
            const btn = document.getElementById('verifyCodeBtn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/auth/verify-code', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email: currentAuthEmail, code: code})
                });
                if (res.ok) {
                    initializeUser(currentAuthEmail);
                } else {
                    const errData = await res.json().catch(() => ({}));
                    showInlineError('step2Error', errData.detail || 'Invalid or expired code.');
                }
            } catch (e) {
                showInlineError('step2Error', 'Network error while verifying code.');
            } finally {
                btn.disabled = false;
            }
        }

        function initializeUser(email) {
            document.getElementById('emailModal').style.display = 'none';
            document.getElementById('hiddenEmail').value = email;
            document.getElementById('currentUserDisplay').textContent = email + ' (Switch)';
            fetchUserData();
        }

        async function resetUser() {
            await fetch('/api/auth/logout', { method: 'POST' });
            location.reload();
        }

        async function fetchUserData() {
            try {
                const response = await fetch('/api/user-info');
                if (!response.ok) return;
                const data = await response.json();
                const cardsDiv = document.getElementById('savedCardsList');
                cardsDiv.innerHTML = '';
                if (data.cards && data.cards.length > 0) {
                    document.getElementById('savedCardsSection').style.display = 'block';
                    data.cards.forEach(card => {
                        const chip = document.createElement('button');
                        chip.type = 'button';
                        chip.className = 'saved-card-chip';
                        chip.textContent = card.mask + ' · ' + card.expiry;
                        chip.onclick = () => fillCard(card, chip);
                        cardsDiv.appendChild(chip);
                    });
                }
                const histDiv = document.getElementById('historyList');
                histDiv.innerHTML = '';
                if (data.operations && data.operations.length > 0) {
                    document.getElementById('historyContainer').style.display = 'block';
                    data.operations.forEach(op => {
                        const row = document.createElement('div');
                        row.className = 'history-row';

                        const left = document.createElement('div');
                        const refEl = document.createElement('div');
                        refEl.style.cssText = 'font-weight: 500; font-size: 14px;';
                        refEl.textContent = op.reference;
                        const metaEl = document.createElement('div');
                        metaEl.style.cssText = 'font-size: 12px; color: var(--text-secondary);';
                        metaEl.textContent = `${op.date} · ${op.card_mask}`;
                        left.appendChild(refEl);
                        left.appendChild(metaEl);

                        const right = document.createElement('div');
                        right.style.cssText = 'font-family: var(--font-mono); font-size: 14px; font-weight: 500;';
                        right.textContent = `${op.amount} ${currencySymbol}`;

                        row.appendChild(left);
                        row.appendChild(right);
                        histDiv.appendChild(row);
                    });
                }
            } catch (e) { console.error(e); }
        }

        function fillCard(card, element) {
            document.querySelectorAll('.saved-card-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');

            document.getElementById('savedCardId').value = card.id;
            document.getElementById('clearSavedCardBtn').style.display = 'inline';

            const cardInput = document.getElementById('cardNumber');
            cardInput.value = "**** **** **** " + card.mask.slice(-4);
            cardInput.disabled = true;

            const expiryInput = document.getElementById('expiry');
            expiryInput.value = card.expiry;
            expiryInput.disabled = true;

            const cvvInput = document.getElementById('cvv');
            cvvInput.value = "***";
            cvvInput.disabled = true;

            document.getElementById('saveCard').disabled = true;
            document.getElementById('saveCard').checked = false;
        }

        function clearSavedCardSelection() {
            document.getElementById('savedCardId').value = '';
            document.getElementById('clearSavedCardBtn').style.display = 'none';
            document.querySelectorAll('.saved-card-chip').forEach(c => c.classList.remove('active'));

            const cardInput = document.getElementById('cardNumber');
            cardInput.disabled = false;
            cardInput.value = '';

            const expiryInput = document.getElementById('expiry');
            expiryInput.disabled = false;
            expiryInput.value = '';

            const cvvInput = document.getElementById('cvv');
            cvvInput.disabled = false;
            cvvInput.value = '';

            document.getElementById('saveCard').disabled = false;
            cardInput.focus();
        }

        function fillSandboxCard() {
            clearSavedCardSelection();
            document.getElementById('cardNumber').value = '4444 4444 4444 4444';
            document.getElementById('expiry').value = '12/30';
            document.getElementById('cvv').value = '123';
        }

        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '').slice(0, 16);
            e.target.value = value.match(/.{1,4}/g)?.join(' ') || value;
            document.getElementById('savedCardId').value = '';
            document.querySelectorAll('.saved-card-chip').forEach(c => c.classList.remove('active'));
        });

        document.getElementById('expiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) value = value.slice(0, 2) + '/' + value.slice(2, 4);
            e.target.value = value;
        });

        document.getElementById('modalEmailInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); sendAuthCode(); }
        });

        document.getElementById('modalCodeInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') { e.preventDefault(); verifyAuthCode(); }
        });
    </script>
</body>
</html>
