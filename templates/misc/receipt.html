<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Receipt - AcquireMock</title>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #F5F1ED;
            padding: 40px 20px;
            margin: 0;
            color: #242222;
        }

        .receipt-container {
            max-width: 440px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid rgba(36, 34, 34, 0.09);
            overflow: hidden;
        }

        .top-accent {
            height: 4px;
            background: #D96F70;
            width: 100%;
        }

        .header {
            padding: 32px 32px 20px;
        }

        .brand {
            font-size: 14px;
            font-weight: 600;
            color: #242222;
            margin-bottom: 20px;
        }

        .amount-label {
            font-size: 12px;
            color: #757070;
            font-weight: 500;
            margin-bottom: 6px;
            display: block;
        }

        .amount {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 36px;
            font-weight: 500;
            margin: 0;
            color: #242222;
            line-height: 1.1;
        }

        .status-badge {
            display: inline-block;
            margin-top: 16px;
            padding: 4px 10px;
            background: #E7F2EC;
            color: #1B5E3A;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .divider {
            border-bottom: 1px solid rgba(36, 34, 34, 0.09);
            margin: 0 32px;
        }

        .content {
            padding: 20px 32px 32px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 14px;
            align-items: baseline;
            gap: 12px;
        }

        .row:last-child { margin-bottom: 0; }

        .label {
            color: #5C5757;
            font-size: 13px;
        }

        .value {
            color: #242222;
            font-weight: 500;
            font-size: 13.5px;
            text-align: right;
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
        }

        .footer {
            background: #EFEAE4;
            padding: 20px 32px;
            color: #5C5757;
            font-size: 12px;
            border-top: 1px solid rgba(36, 34, 34, 0.09);
        }
    </style>
</head>
<body>
    <div class="receipt-container">
        <div class="top-accent"></div>

        <div class="header">
            <div class="brand">AcquireMock</div>
            <span class="amount-label">Paid amount</span>
            <div class="amount">{{ formatted_amount }}</div>
            <div class="status-badge">Paid</div>
        </div>

        <div class="divider"></div>

        <div class="content">
            <div class="row">
                <span class="label">Date</span>
                <span class="value">{{ date }}</span>
            </div>
            <div class="row">
                <span class="label">Reference</span>
                <span class="value">#{{ reference }}</span>
            </div>
            <div class="row">
                <span class="label">Card</span>
                <span class="value">{{ card_mask }}</span>
            </div>
            <div class="row">
                <span class="label">Payment ID</span>
                <span class="value" style="font-size: 12px;">{{ payment_id }}</span>
            </div>
        </div>

        <div class="footer">
            Sandbox receipt generated by AcquireMock. Keep this copy for your integration logs.
        </div>
    </div>
</body>
</html>
