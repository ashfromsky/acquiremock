<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AcquireMock Verification Code</title>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #F5F1ED;
            margin: 0;
            padding: 40px 20px;
            color: #242222;
        }

        .email-container {
            max-width: 440px;
            margin: 0 auto;
            background: #FFFFFF;
            border-radius: 16px;
            border: 1px solid rgba(36, 34, 34, 0.09);
            overflow: hidden;
        }

        .top-accent {
            height: 4px;
            background: #D96F70;
            width: 100%;
        }

        .inner {
            padding: 36px 32px;
        }

        .logo {
            font-size: 14px;
            font-weight: 600;
            color: #242222;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 500;
            margin: 0 0 10px 0;
            color: #242222;
        }

        .description {
            color: #5C5757;
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 24px 0;
        }

        .code-box {
            background: #F5F1ED;
            border: 1px solid rgba(36, 34, 34, 0.14);
            border-radius: 10px;
            padding: 20px;
            margin: 0 0 24px 0;
            text-align: center;
        }

        .code {
            font-family: 'IBM Plex Mono', ui-monospace, monospace;
            font-size: 32px;
            font-weight: 500;
            letter-spacing: 0.3em;
            color: #B04446;
            margin: 0;
        }

        .warning {
            font-size: 12.5px;
            color: #757070;
            margin: 0;
            line-height: 1.5;
        }

        .footer {
            background: #EFEAE4;
            padding: 18px 32px;
            font-size: 12px;
            color: #5C5757;
            border-top: 1px solid rgba(36, 34, 34, 0.09);
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="top-accent"></div>
        <div class="inner">
            <div class="logo">AcquireMock</div>
            <h1>Verification code</h1>
            <p class="description">Enter this 4-digit code to verify your sandbox session or payment.</p>

            <div class="code-box">
                <div class="code">{{ code }}</div>
            </div>

            <p class="warning">
                If you did not initiate this request, you can ignore this message.
            </p>
        </div>

        <div class="footer">
            AcquireMock sandbox notification
        </div>
    </div>
</body>
</html>
