<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440" role="img" aria-label="Transaction Lifecycle">
  <defs>
    <clipPath id="cap-transaction-lifecycle-clip">
      <rect x="0" y="0" width="640" height="440" rx="22" />
    </clipPath>
  </defs>
  <g clip-path="url(#cap-transaction-lifecycle-clip)">
    <rect width="640" height="440" fill="#F5F1ED" />

    <!-- Subtle top index tag -->
    <text x="44.0" y="48.0" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="11.0" font-weight="700" fill="#B04446" letter-spacing="1.32px">CAPABILITY  02</text>

    <!-- Abstract Brand-Derived Geometric Stage (y=56..304) -->
    
      <!-- Quiet baseline reference rail -->
      <line x1="92" y1="184" x2="548" y2="184" stroke="#DDD4CA" stroke-width="1.5" />
      <!-- Continuous flowing organic wave derived from loop curvature -->
      <path d="M 116 218 C 148 118, 224 118, 256 184 C 288 250, 352 250, 384 184 C 416 118, 492 118, 524 218"
            fill="none" stroke="#F2B8B3" stroke-width="18" stroke-linecap="round" opacity="0.55" />
      <path d="M 116 218 C 148 118, 224 118, 256 184 C 288 250, 352 250, 384 184 C 416 118, 492 118, 524 176"
            fill="none" stroke="#E99A98" stroke-width="16" stroke-linecap="round" />
      <!-- Four lifecycle state stops: Invoice -> Checkout -> OTP -> Settlement -->
      <circle cx="116" cy="218" r="14" fill="#242222" />
      <circle cx="256" cy="184" r="14" fill="#F5F1ED" stroke="#242222" stroke-width="5" />
      <circle cx="384" cy="184" r="14" fill="#F5F1ED" stroke="#C55557" stroke-width="5" />
      <circle cx="524" cy="176" r="16" fill="#C55557" />
      <circle cx="524" cy="176" r="6" fill="#F5F1ED" />
    

    <!-- Editorial Caption Bar -->
    <line x1="44" y1="316" x2="596" y2="316" stroke="#DDD4CA" stroke-width="1" />
    <text x="44.0" y="358.0" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="24.0" font-weight="600" fill="#242222" letter-spacing="-0.36px">Transaction Lifecycle</text>
    <text x="44.0" y="392.0" font-family="Montserrat, 'Helvetica Neue', Arial, sans-serif" font-size="15.0" font-weight="500" fill="#5C5757">Invoice creation through checkout, OTP, and settlement.</text>

    <!-- Crisp 1px outer hairline -->
    <rect x="0.5" y="0.5" width="639" height="439" rx="22" fill="none" stroke="#E3DBD2" stroke-width="1" />
  </g>
</svg>